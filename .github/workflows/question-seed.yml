name: Question Seed Capture

on:
  push:
    paths:
      - "data/*.seed.json"

# The repo default workflow token is read-only; the push below needs write.
permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Index
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p docs
          echo "## Question Seeds" > docs/question_seeds.md
          for f in data/*.seed.json; do
            id=$(jq -r '.id' "$f")
            question=$(jq -r '.question // empty' "$f")
            echo "- **$id**: $question" >> docs/question_seeds.md
          done

      - name: Commit Index
        run: |
          set -euo pipefail
          git config user.name "ai-integrator-bot"
          git config user.email "actions@github.com"
          git add docs/question_seeds.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update Question Seeds index"
          git push
